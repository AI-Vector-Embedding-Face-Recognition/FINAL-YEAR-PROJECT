<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Device preview | FaceVector Attendance</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#0a1128;color:#e9eefc;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;background:linear-gradient(90deg,#0b1f4b,#14307a);border-bottom:3px solid #f5b301}
.top b{margin-right:auto;font-size:1.05rem}
.grp{display:flex;gap:6px;flex-wrap:wrap}
.top button{font:inherit;color:#c9d6f5;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:6px 12px;cursor:pointer;transition:background .2s}
.top button:hover{background:rgba(255,255,255,.2)}
.top button.on{background:#f5b301;color:#0b1f4b;font-weight:700;border-color:#f5b301}
.sep{width:1px;height:26px;background:rgba(255,255,255,.3);margin:0 4px}
.note{padding:8px 16px;font-size:.88rem;color:#a6b4d8}
.stage{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:10px 16px 30px;overflow:auto}
.device{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.55);transition:width .4s ease,height .4s ease,border-radius .4s,border-width .4s;border:0 solid #1b2547;max-width:100%}
.device.laptop{width:1280px;height:calc(100vh - 150px);min-height:520px}
.device.tablet{width:820px;height:1000px;max-height:calc(100vh - 150px);border-width:12px;border-radius:26px}
.device.phone{width:390px;height:780px;max-height:calc(100vh - 150px);border-width:12px;border-radius:38px}
iframe{width:100%;height:100%;border:0;display:block;background:#fff}
</style>
</head>
<body>
<div class="top">
  <b>FaceVector Attendance: device preview</b>
  <div class="grp" id="pages"></div>
  <span class="sep"></span>
  <div class="grp" id="devs"></div>
</div>
<div class="note" id="note"></div>
<div class="stage"><div class="device laptop" id="dev"><iframe id="frame" src="index.html" allow="camera" title="Website preview"></iframe></div></div>
<script>
const pages=[['index.html','Home'],['about.html','About'],['register.html','Register'],['attendance.html','Attendance'],['records.html','Records'],['lab.html','2D Lab'],['admin.html','Admin'],['contact.html','Contact']];
const devs=[['laptop','Laptop','1280 px wide'],['tablet','Tablet','820 px wide'],['phone','Phone','390 px wide']];
const $=id=>document.getElementById(id), frame=$('frame'), dev=$('dev');
let page=(location.hash||'#index.html').slice(1), mode='laptop';
function paint(){
  $('pages').innerHTML=pages.map(([h,t])=>`<button data-p="${h}" class="${h===page?'on':''}">${t}</button>`).join('');
  $('devs').innerHTML=devs.map(([k,t])=>`<button data-d="${k}" class="${k===mode?'on':''}">${t}</button>`).join('');
  dev.className='device '+mode;
  $('note').textContent='Showing '+page+' as '+devs.find(d=>d[0]===mode)[1]+' ('+devs.find(d=>d[0]===mode)[2]+'). Links and buttons work like the real site.';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.p){ page=b.dataset.p; frame.src=page; location.hash=page; }
  if(b.dataset.d){ mode=b.dataset.d; }
  paint();
});
// keep the page buttons in sync when you click links inside the preview
frame.addEventListener('load',()=>{ try{ const n=frame.contentWindow.location.pathname.split('/').pop()||'index.html'; if(pages.some(p=>p[0]===n)){ page=n; paint(); } }catch(e){} });
paint();
</script>
</body></html>
