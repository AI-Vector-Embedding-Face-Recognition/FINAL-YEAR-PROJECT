<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://cdn.jsdelivr.net; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Register face | FaceVector Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="assistant.css">
<script src="js/theme.js"></script>
</head>
<body>
<div id="nav"></div>
<main>
<h1>Register a face</h1>
<p class="lead">Enter the details, start the camera (front or back camera on a phone), then capture 5 samples. Use good light, and turn your head slightly between samples.</p>
<div class="grid">
  <div class="card">
    <div class="cam"><video id="video" playsinline muted></video><canvas id="overlay"></canvas><div class="ph">Camera is off</div></div>
    <div class="row">
      <button class="btn alt" id="start">Start camera</button>
      <button class="btn alt" id="flip" disabled>Switch camera</button><select id="camsel" class="camsel" aria-label="Choose camera" hidden></select>
      <button class="btn" id="cap" disabled>Capture sample</button>
      <span class="badge" id="quality">Camera off</span>
    </div>
    <div class="status" id="status" role="status">Loading face models...</div>
  </div>
  <div class="card">
    <label for="name">Full name</label><input id="name" placeholder="Full name" autocomplete="off" maxlength="60" required>
    <div class="two">
      <div><label for="roll">Roll / ID number</label><input id="roll" placeholder="Roll or ID number" autocomplete="off" maxlength="30" required></div>
      <div><label for="cls">Class (optional)</label><input id="cls" placeholder="Class" autocomplete="off" maxlength="40"></div>
    </div>
    <h3>Samples: <span id="count">0</span> / 5</h3>
    <div class="meter" id="bar"><i></i></div>
    <div class="row"><button class="btn" id="save" disabled>Save person</button><button class="btn danger" id="reset">Clear samples</button></div>
    <h3 class="mt22">Recently registered</h3>
    <div class="scroll"><table><thead><tr><th>Name</th><th>Roll</th><th>Class</th></tr></thead><tbody id="recent"></tbody></table></div>
  </div>
</div>
</main>
<div id="foot"></div>
<script src="js/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js" crossorigin="anonymous"></script>
<script src="js/face.js"></script><script src="js/register.js"></script><script src="js/assistant-core.js"></script><script src="js/assistant.js"></script>
</body></html>
